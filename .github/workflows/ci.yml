name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # re-publish the tablet build of main by hand

# A newer push to the same branch cancels the older run, so an older run can
# never finish last and publish an older build over a newer one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy.sh scripts/*.sh backend/scripts/*.sh

  # Builds the arm64 tablet bundle on every run, pull requests included, and
  # boots it under qemu to check it serves the API and the frontend. A change
  # that breaks the cross-compile, the ELF patching or the bundle itself fails
  # here, before it is merged.
  bundle:
    name: Tablet bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build bundle
        run: scripts/build-bundle.sh "$RUNNER_TEMP/tablet"
      - name: Smoke-test the bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static libc6-arm64-cross > /dev/null
          scripts/smoke-bundle.sh "$RUNNER_TEMP/tablet/lumina-arm64.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: lumina-arm64
          path: ${{ runner.temp }}/tablet
          retention-days: 14

  # Continuous delivery for the Termux tablet. Once a commit on main passes
  # every check, publish the bundle built and smoke-tested above as the
  # `tablet-deploy` release. The tablet runs backend/scripts/tab-deploy.sh,
  # which watches that release, so it only ever installs commits that passed
  # CI. Nothing is built on the tablet itself. See docs/TAB-DEPLOY.md.
  publish-tablet:
    name: Publish tablet build
    needs: [backend, frontend, scripts, bundle]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The exact files the bundle job tested, not a rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: lumina-arm64
          path: ${{ runner.temp }}/tablet

      - name: Publish the tablet-deploy release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/tablet
        run: |
          git tag -f tablet-deploy "$GITHUB_SHA"
          git push -f origin refs/tags/tablet-deploy

          subject="$(git log -1 --format=%s)"
          notes="Built by CI from ${GITHUB_SHA} (${subject}). The tablet installs this automatically; see docs/TAB-DEPLOY.md."
          if gh release view tablet-deploy >/dev/null 2>&1; then
            gh release edit tablet-deploy --prerelease --notes "$notes"
          else
            gh release create tablet-deploy --prerelease --verify-tag \
              --title "Tablet build (rolling)" --notes "$notes"
          fi

          # VERSION goes last: the tablet acts when VERSION changes and checks
          # that the bundle it downloads matches it, so a check that lands
          # mid-upload just retries.
          gh release upload tablet-deploy "$OUT/lumina-arm64.tar.gz" "$OUT/lumina-arm64.tar.gz.sha256" --clobber
          gh release upload tablet-deploy "$OUT/VERSION" --clobber

          {
            echo "### Tablet build published"
            echo
            echo "\`$(head -n 1 "$OUT/VERSION")\` — ${subject}"
            echo
            echo "The tablet picks it up on its next check (within 60s by default)."
          } >>"$GITHUB_STEP_SUMMARY"
